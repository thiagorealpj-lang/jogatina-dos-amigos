<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogatina Dos Amigos - By C0kz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Rajdhani', sans-serif; background-color: #09090b; color: #f4f4f5; }
    .font-cyber { font-family: 'Orbitron', sans-serif; }
    .neon-border { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
    .neon-glow { filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.6)); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-gradient-to-br from-gray-950 via-purple-950/20 to-black">

  <!-- Tela de Login -->
  <div id="login-screen" class="flex-1 flex items-center justify-center p-4">
    <div class="bg-gray-900/80 border border-purple-500/30 p-8 rounded-2xl w-full max-w-md neon-border backdrop-blur-md">
      <h1 class="text-3xl font-cyber text-center font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 mb-2">
        JOGATINA DOS AMIGOS
      </h1>
      <p class="text-xs font-cyber text-center text-purple-400 tracking-widest mb-6">BY C0KZ</p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-cyber text-gray-400 mb-1">TEU NICK</label>
          <input id="input-nick" type="text" placeholder="Ex: ProGamer" class="w-full bg-gray-950 border border-purple-900/50 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-500 transition">
        </div>
        <div>
          <label class="block text-xs font-cyber text-gray-400 mb-1">CÓDIGO DA SALA</label>
          <input id="input-room" type="text" placeholder="Ex: sala-dos-crias" class="w-full bg-gray-950 border border-purple-900/50 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-500 transition">
        </div>
        <button onclick="entrarNaSala()" class="w-full bg-gradient-to-r from-purple-600 to-cyan-600 hover:from-purple-500 hover:to-cyan-500 font-cyber font-bold py-3 rounded-lg transition transform active:scale-95 shadow-lg">
          ENTRAR NA SALA
        </button>
      </div>
    </div>
  </div>

  <!-- App Principal -->
  <div id="app-screen" class="hidden flex-1 flex flex-col h-screen p-4 gap-4 max-w-7xl mx-auto w-full">
    <header class="bg-gray-900/80 border border-purple-900/40 p-4 rounded-xl flex justify-between items-center backdrop-blur-md">
      <div>
        <h2 class="font-cyber font-bold text-cyan-400 text-lg">JOGATINA DOS AMIGOS</h2>
        <span class="text-xs text-gray-400">Sala: <strong id="display-room" class="text-purple-400">---</strong></span>
      </div>
      <div class="flex gap-2">
        <button id="btn-copy-link" onclick="copiarLink()" class="bg-purple-950 border border-purple-500/50 hover:bg-purple-900 font-cyber text-xs px-3 py-2 rounded-lg transition">
          <span id="btn-copy-text">Copiar ID/Link</span>
        </button>
        <button onclick="sairDaSala()" class="bg-red-950 border border-red-500/50 hover:bg-red-900 font-cyber text-xs px-3 py-2 rounded-lg transition text-red-300">
          Sair
        </button>
      </div>
    </header>

    <div class="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-4 overflow-hidden">
      <!-- Grade de Vídeos / Telas Compartilhadas -->
      <div class="lg:col-span-3 bg-gray-950/60 border border-purple-900/30 rounded-xl p-4 flex flex-col justify-between overflow-y-auto">
        <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 flex-1 items-center justify-center min-h-[300px]">
          <div id="no-shares-msg" class="col-span-2 text-center text-gray-500 font-cyber text-sm">
            Nenhum compartilhamento de tela ativo no momento.
          </div>
        </div>
        
        <!-- Painel de Controles -->
        <div class="flex justify-center items-center gap-4 mt-4 pt-3 border-t border-gray-800/50">
          <button id="btn-mic" onclick="toggleMic()" class="bg-emerald-600 hover:bg-emerald-500 font-cyber text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-2 font-bold shadow-lg">
            🎤 Microfone: LIGADO
          </button>
          <button id="btn-screen" onclick="toggleScreenShare()" class="bg-purple-600 hover:bg-purple-500 font-cyber text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-2 font-bold shadow-lg">
            📺 Compartilhar Tela
          </button>
        </div>
      </div>

      <!-- Barra Lateral -->
      <div class="flex flex-col gap-4">
        <div class="bg-gray-900/60 border border-purple-900/30 p-3 rounded-xl h-2/5 flex flex-col">
          <h3 class="font-cyber text-xs text-gray-400 mb-2">ONLINE (<span id="user-count">0</span>)</h3>
          <div id="users-list" class="flex-1 overflow-y-auto space-y-1 text-sm"></div>
        </div>

        <div class="bg-gray-900/60 border border-purple-900/30 p-3 rounded-xl flex-1 flex flex-col justify-between">
          <h3 class="font-cyber text-xs text-gray-400 mb-2">CHAT DA SALA</h3>
          <div id="chat-box" class="flex-1 overflow-y-auto space-y-2 mb-2 text-sm text-gray-300"></div>
          <div class="flex gap-2">
            <input id="chat-input" type="text" placeholder="Mensagem..." class="flex-1 bg-gray-950 border border-purple-900/40 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-cyan-500" onkeydown="if(event.key==='Enter') enviarMsg()">
            <button onclick="enviarMsg()" class="bg-cyan-600 hover:bg-cyan-500 font-cyber text-xs px-3 rounded-lg font-bold transition">Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="audio-containers" class="hidden"></div>

  <script>
    let socket;
    let localAudioStream = null;
    let localScreenStream = null;
    let roomId, nick;
    let peers = {};
    let mutedUsers = {};
    let isMicMuted = false;
    let currentUsersList = [];

    const rtcConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    async function entrarNaSala() {
      nick = document.getElementById('input-nick').value.trim();
      roomId = document.getElementById('input-room').value.trim();

      if (!nick || !roomId) return alert('Preencha o Nick e a Sala!');

      try {
        localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (err) {
        console.warn('Microfone não ativado:', err);
      }

      // Inicializa a interface imediatamente
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('display-room').innerText = roomId;

      // Conecta ao Socket.io
      socket = io({ transports: ['websocket', 'polling'] });

      socket.on('connect', () => {
        console.log('Conectado ao servidor, entrando na sala...');
        socket.emit('join-room', { roomId, nick });
      });

      socket.on('user-connected', ({ peerId, nick: peerNick }) => {
        iniciarConexaoWebRTC(peerId, peerNick, true);
      });

      socket.on('signal', async ({ from, signal, type, nick: peerNick }) => {
        if (!peers[from]) {
          iniciarConexaoWebRTC(from, peerNick, false);
        }

        const peer = peers[from].pc;

        if (type === 'offer') {
          await peer.setRemoteDescription(new RTCSessionDescription(signal));
          const answer = await peer.createAnswer();
          await peer.setLocalDescription(answer);
          socket.emit('signal', { to: from, signal: answer, type: 'answer', nick });
        } else if (type === 'answer') {
          await peer.setRemoteDescription(new RTCSessionDescription(signal));
        } else if (type === 'candidate') {
          try {
            await peer.addIceCandidate(new RTCIceCandidate(signal));
          } catch (e) {}
        }
      });

      socket.on('user-list', (users) => {
        currentUsersList = users;
        renderizarListaUsuarios();
      });

      socket.on('receive-chat', ({ nick, msg, time }) => {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML += `<div><span class="text-gray-500">[${time}]</span> <strong class="text-purple-400">${nick}:</strong> ${msg}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      socket.on('user-disconnected', (peerId) => {
        if (peers[peerId]) {
          peers[peerId].pc.close();
          delete peers[peerId];
        }
        const videoElem = document.getElementById(`video-${peerId}`);
        if (videoElem
