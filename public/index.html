<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogatina Dos Amigos - By C0kz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Rajdhani', sans-serif; background-color: #09090b; color: #f4f4f5; }
    .font-cyber { font-family: 'Orbitron', sans-serif; }
    .neon-border { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
    .neon-glow { filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.6)); }
    @keyframes pulse-live {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    .live-badge { animation: pulse-live 1.5s infinite; }
    .speaking-glow { border: 2px solid #10b981 !important; box-shadow: 0 0 10px #10b981; }
    
    #video-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
      align-items: center;
    }

    .video-box {
      width: 320px !important;
      height: 320px !important;
      max-width: 320px;
      max-height: 320px;
      transition: all 0.3s ease;
      flex-shrink: 0;
      order: 2;
    }

    .video-box.expanded {
      width: 100% !important;
      height: 540px !important;
      max-width: 100% !important;
      max-height: 540px !important;
      order: 1;
    }

    input[type=range] {
      accent-color: #a855f7;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-gradient-to-br from-gray-950 via-purple-950/20 to-black" onclick="desbloquearAudioGlobal()">

  <!-- Tela de Login -->
  <div id="login-screen" class="flex-1 flex items-center justify-center p-4">
    <div class="bg-gray-900/80 border border-purple-500/30 p-8 rounded-2xl w-full max-w-md neon-border backdrop-blur-md">
      <h1 class="text-3xl font-cyber text-center font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 mb-2">
        JOGATINA DOS AMIGOS
      </h1>
      <p class="text-xs font-cyber text-center text-purple-400 tracking-widest mb-6">BY C0KZ</p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-cyber text-gray-400 mb-1">TEU NICK</label>
          <input id="input-nick" type="text" placeholder="Ex: ProGamer" class="w-full bg-gray-950 border border-purple-900/50 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-500 transition">
        </div>
        <div>
          <label class="block text-xs font-cyber text-gray-400 mb-1">CÓDIGO DA SALA</label>
          <input id="input-room" type="text" placeholder="Ex: sala-dos-crias" class="w-full bg-gray-950 border border-purple-900/50 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-500 transition">
        </div>
        <button onclick="entrarNaSala()" class="w-full bg-gradient-to-r from-purple-600 to-cyan-600 hover:from-purple-500 hover:to-cyan-500 font-cyber font-bold py-3 rounded-lg transition transform active:scale-95 shadow-lg cursor-pointer">
          ENTRAR NA SALA
        </button>
      </div>
    </div>
  </div>

  <!-- App Principal -->
  <div id="app-screen" class="hidden flex-1 flex flex-col h-screen p-4 gap-4 max-w-[98%] mx-auto w-full">
    <header class="bg-gray-900/80 border border-purple-900/40 p-4 rounded-xl flex justify-between items-center backdrop-blur-md">
      <div class="flex items-baseline gap-3">
        <h2 class="font-cyber font-bold text-cyan-400 text-lg">JOGATINA DOS AMIGOS</h2>
        <span class="text-xs font-cyber text-purple-400 tracking-wider">BY C0KZ</span>
        <span class="text-xs text-gray-400 ml-2">Sala: <strong id="display-room" class="text-purple-400">---</strong></span>
      </div>
      <div class="flex gap-2">
        <button id="btn-copy-link" onclick="copiarLink()" class="bg-purple-950 border border-purple-500/50 hover:bg-purple-900 font-cyber text-xs px-3 py-2 rounded-lg transition cursor-pointer">
          <span id="btn-copy-text">Copiar ID/Link</span>
        </button>
        <button onclick="sairDaSala()" class="bg-red-950 border border-red-500/50 hover:bg-red-900 font-cyber text-xs px-3 py-2 rounded-lg transition text-red-300 cursor-pointer">
          Sair
        </button>
      </div>
    </header>

    <div class="flex-1 grid grid-cols-1 lg:grid-cols-5 gap-4 overflow-hidden pb-2">
      <!-- Grade de Vídeos / Telas Compartilhadas -->
      <div class="lg:col-span-4 bg-gray-950/60 border border-purple-900/30 rounded-xl p-4 flex flex-col justify-between overflow-y-auto">
        <div id="video-grid" class="flex-1 content-start py-2">
          <div id="no-shares-msg" class="w-full text-center text-gray-500 font-cyber text-sm my-auto">
            Nenhum compartilhamento de tela ativo no momento.
          </div>
        </div>
        
        <!-- Painel de Controles -->
        <div class="flex justify-center items-center gap-4 mt-4 pt-3 border-t border-gray-800/50">
          <button id="btn-mic" onclick="toggleMic()" title="Mutar/Desmutar Microfone" class="bg-emerald-600 hover:bg-emerald-500 p-3.5 rounded-xl transition flex items-center justify-center shadow-lg text-xl cursor-pointer">
            🎤
          </button>
          
          <button id="btn-master-mute" onclick="toggleMasterMute()" title="Mutar Microfone e Áudio Geral do Servidor" class="bg-gray-700 hover:bg-gray-600 p-3.5 rounded-xl transition flex items-center justify-center shadow-lg text-xl cursor-pointer">
            🎧
          </button>

          <button id="btn-screen" onclick="toggleScreenShare()" class="bg-purple-600 hover:bg-purple-500 font-cyber text-xs px-6 py-3.5 rounded-xl transition flex items-center gap-2 font-bold shadow-lg cursor-pointer">
            📺 Compartilhar Tela
          </button>
        </div>
      </div>

      <!-- Barra Lateral Unificada -->
      <div class="lg:col-span-1 flex flex-col gap-4 overflow-hidden">
        <div class="bg-gray-900/60 border border-purple-900/30 p-3 rounded-xl h-2/5 flex flex-col">
          <h3 class="font-cyber text-xs text-gray-400 mb-2">ONLINE (<span id="user-count">0</span>)</h3>
          <div id="users-list" class="flex-1 overflow-y-auto space-y-2 text-sm pr-1"></div>
        </div>

        <div class="bg-gray-900/60 border border-purple-900/30 p-3 rounded-xl h-3/5 flex flex-col justify-between">
          <h3 class="font-cyber text-xs text-gray-400 mb-2">CHAT DA SALA</h3>
          <div id="chat-box" class="flex-1 overflow-y-auto space-y-2 mb-2 text-sm text-gray-300 pr-1"></div>
          <div class="flex gap-2">
            <input id="chat-input" type="text" placeholder="Mensagem..." class="flex-1 bg-gray-950 border border-purple-900/40 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-cyan-500" onkeydown="if(event.key==='Enter') enviarMsg()">
            <button onclick="enviarMsg()" class="bg-cyan-600 hover:bg-cyan-500 font-cyber text-xs px-3 rounded-lg font-bold transition cursor-pointer">Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="audio-containers"></div>

  <script>
    let socket;
    let localAudioStream = null;
    let localScreenStream = null;
    let roomId, nick;
    let peers = {};
    let mutedUsers = {};
    let userVolumes = {};
    let sharingUsers = {};
    let isMicMuted = false;
    let isMasterMuted = false;
    let currentUsersList = [];

    const rtcConfig = {
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    };

    function desbloquearAudioGlobal() {
      document.querySelectorAll('#audio-containers audio').forEach(audio => {
        audio.play().catch(e => {});
      });
    }

    async function entrarNaSala() {
      nick = document.getElementById('input-nick').value.trim();
      roomId = document.getElementById('input-room').value.trim();

      if (!nick || !roomId) return alert('Preencha o Nick e a Sala!');

      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('display-room').innerText = roomId;

      try {
        localAudioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        monitorarVozLocal(localAudioStream);
      } catch (err) {
        console.warn('Microfone não ativado:', err);
      }

      socket = io({ transports: ['websocket', 'polling'] });

      socket.on('connect', () => {
        socket.emit('join-room', { roomId, nick });
      });

      socket.on('user-connected', ({ peerId, nick: peerNick }) => {
        criarConexao(peerId, peerNick, true);
      });

      socket.on('signal', async ({ from, signal, type, nick: peerNick }) => {
        if (!peers[from]) {
          criarConexao(from, peerNick, false);
        }

        const peer = peers[from].pc;

        if (type === 'offer') {
          await peer.setRemoteDescription(new RTCSessionDescription(signal));
          const answer = await peer.createAnswer();
          await peer.setLocalDescription(answer);
          socket.emit('signal', { to: from, signal: answer, type: 'answer', nick });
        } else if (type === 'answer') {
          await peer.setRemoteDescription(new RTCSessionDescription(signal));
        } else if (type === 'candidate') {
          try {
            await peer.addIceCandidate(new RTCIceCandidate(signal));
          } catch (e) {}
        }
      });

      socket.on('user-list', (users) => {
        currentUsersList = users;
        renderizarListaUsuarios();
      });

      socket.on('receive-chat', ({ nick, msg, time }) => {
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML += `<div><span class="text-gray-500">[${time}]</span> <strong class="text-purple-400">${nick}:</strong> ${msg}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      socket.on('user-disconnected', (peerId) => {
        if (peers[peerId]) {
          peers[peerId].pc.close();
          delete peers[peerId];
        }
        delete sharingUsers[peerId];
        delete userVolumes[peerId];
        const videoElem = document.getElementById(`video-container-${peerId}`);
        if (videoElem) videoElem.remove();
        const audioElem = document.getElementById(`audio-${peerId}`);
        if (audioElem) audioElem.remove();
        verificarTelasAtivas();
        renderizarListaUsuarios();
      });
    }

    function monitorarVozLocal(stream) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioCtx.createAnalyser();
        const microphone = audioCtx.createMediaStreamSource(stream);
        microphone.connect(analyser);
        analyser.fftSize = 512;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        setInterval(() => {
          if (isMicMuted || isMasterMuted) return;
          analyser.getByteFrequencyData(dataArray);
          let sum = dataArray.reduce((a, b) => a + b, 0);
          let average = sum / dataArray.length;
          const userCard = document.getElementById(`user-card-${socket.id}`);
          if (userCard) {
            if (average > 12) {
              userCard.classList.add('speaking-glow');
            } else {
              userCard.classList.remove('speaking-glow');
            }
          }
        }, 150);
      } catch (e) {}
    }

    function monitorarVozRemota(stream, peerId) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 512;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        setInterval(() => {
          if (mutedUsers[peerId] || isMasterMuted) return;
          analyser.getByteFrequencyData(dataArray);
          let sum = dataArray.reduce((a, b) => a + b, 0);
          let average = sum / dataArray.length;
          const userCard = document.getElementById(`user-card-${peerId}`);
          if (userCard) {
            if (average > 10) {
              userCard.classList.add('speaking-glow');
            } else {
              userCard.classList.remove('speaking-glow');
            }
          }
        }, 150);
      } catch (e) {}
    }

    function renderizarListaUsuarios() {
      document.getElementById('user-count').innerText = currentUsersList.length;
      document.getElementById('users-list').innerHTML = currentUsersList.map(u => {
        const isMe = u.id === socket.id;
        const isMuted = mutedUsers[u.id];
        const isSharing = sharingUsers[u.id];
        const currentVol = userVolumes[u.id] !== undefined ? userVolumes[u.id] : 100;

        return `
          <div id="user-card-${u.id}" class="flex flex-col p-2 rounded-lg bg-gray-800/60 border border-gray-700/50 text-xs transition-all gap-1.5">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2 overflow-hidden">
                <span class="text-cyan-300 font-bold truncate">${u.nick} ${isMe ? '(Você)' : ''}</span>
                ${isSharing ? '<span class="bg-red-600/90 text-white text-[9px] px-1.5 py-0.5 rounded font-cyber live-badge font-bold">🔴 LIVE</span>' : ''}
              </div>
              ${!isMe ? `
                <button onclick="toggleMuteUser('${u.id}')" class="${isMuted ? 'bg-red-900 border-red-500 text-red-300' : 'bg-gray-700 border-gray-600 text-gray-300'} text-[10px] border px-2 py-1 rounded transition shrink-0 cursor-pointer">
                  ${isMuted ? '🔇 Mutado' : '🔊 Ouvindo'}
                </button>
              ` : ''}
            </div>
            ${!isMe ? `
              <div class="flex items-center gap-2 pt-1 border-t border-gray-700/40">
                <span class="text-[10px] text-gray-400">Vol: <span id="vol-text-${u.id}">${currentVol}%</span></span>
                <input type="range" min="0" max="200" value="${currentVol}" oninput="alterarVolumeUser('${u.id}', this.value)" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer">
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function alterarVolumeUser(peerId, valor) {
      userVolumes[peerId] = valor;
      const volText = document.getElementById(`vol-text-${peerId}`);
      if (volText) volText.innerText = `${valor}%`;

      const audioElem = document.getElementById(`audio-${peerId}`);
      if (audioElem) {
        audioElem.volume = valor / 100;
      }
    }

    function criarConexao(peerId, peerNick, isInitiator) {
      const pc = new RTCPeerConnection(rtcConfig);
      peers[peerId] = { pc, nick: peerNick };

      pc.addTransceiver('audio', { direction: 'sendrecv' });
      pc.addTransceiver('video', { direction: 'sendrecv' });

      if (localAudioStream) {
        localAudioStream.getTracks().forEach(track => pc.addTrack(track, localAudioStream));
      }

      if (localScreenStream) {
        localScreenStream.getTracks().forEach(track => pc.addTrack(track, localScreenStream));
      }

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('signal', { to: peerId, signal: event.candidate, type: 'candidate', nick });
        }
      };

      pc.ontrack = (event) => {
        const stream = event.streams[0] || new MediaStream([event.track]);
        const track = event.track;

        if (track.kind === 'audio') {
          let audioElem = document.getElementById(`audio-${peerId}`);
          if (!audioElem) {
            audioElem = document.createElement('audio');
            audioElem.id = `audio-${peerId}`;
            audioElem.autoplay = true;
            audioElem.controls = false;
            document.getElementById('audio-containers').appendChild(audioElem);
          }
          audioElem.srcObject = stream;
          audioElem.muted = isMasterMuted || !!mutedUsers[peerId];
          
          const savedVol = userVolumes[peerId] !== undefined ? userVolumes[peerId] : 100;
          audioElem.volume = savedVol / 100;

          audioElem.play().catch(e => {
            console.log('Autoplay bloqueado pelo navegador. Clique na tela para liberar.');
          });

          monitorarVozRemota(stream, peerId);
        } else if (track.kind === 'video') {
          sharingUsers[peerId] = true;
          renderizarListaUsuarios();

          let container = document.getElementById(`video-container-${peerId}`);
          if (!container) {
            container = document.createElement('div');
            container.id = `video-container-${peerId}`;
            container.className = "video-box relative bg-black rounded-xl overflow-hidden border border-purple-500/40 flex flex-col shadow-lg";
            
            container.innerHTML = `
              <div class="absolute top-2 left-2 bg-black/80 backdrop-blur-md px-2 py-0.5 rounded text-[10px] text-cyan-400 font-cyber z-10 flex items-center gap-1.5">
                <span class="bg-red-600 text-white text-[8px] px-1 py-0.2 rounded live-badge font-bold">LIVE</span>
                ${peerNick}
              </div>
              <div class="absolute top-2 right-2 flex gap-1 z-10">
                <button onclick="toggleExpandVideo('${peerId}')" title="Expandir/Reduzir" class="bg-black/70 hover:bg-black text-white text-xs px-2 py-0.5 rounded border border-purple-500/50 cursor-pointer">🔲</button>
                <button onclick="toggleFullScreenVideo('${peerId}')" title="Ecrã Completo" class="bg-black/70 hover:bg-black text-white text-xs px-2 py-0.5 rounded border border-purple-500/50 cursor-pointer">⛶</button>
              </div>
              <video id="video-${peerId}" autoplay playsinline class="w-full h-full object-contain cursor-pointer" onclick="toggleFullScreenVideo('${peerId}')"></video>
            `;
            document.getElementById('video-grid').appendChild(container);
          }

          const videoElem = document.getElementById(`video-${peerId}`);
          const videoStream = new MediaStream([track]);
          videoElem.srcObject = videoStream;
          
          videoElem.onloadedmetadata = () => {
            videoElem.play().catch(e => console.log('Autoplay erro:', e));
          };

          verificarTelasAtivas();

          track.onended = () => {
            delete sharingUsers[peerId];
            if (container) container.remove();
            verificarTelasAtivas();
            renderizarListaUsuarios();
          };
        }
      };

      if (isInitiator) {
        pc.onnegotiationneeded = async () => {
          try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.emit('signal', { to: peerId, signal: offer, type: 'offer', nick });
          } catch (e) {}
        };
      }
    }

    function toggleMic() {
      if (!localAudioStream) return alert('Microfone não detetado.');
      isMicMuted = !isMicMuted;
      localAudioStream.getAudioTracks().forEach(track => track.enabled = !isMicMuted && !isMasterMuted);

      const btn = document.getElementById('btn-mic');
      const userCard = document.getElementById(`user-card-${socket.id}`);
      if (isMicMuted) {
        btn.className = "bg-red-600 hover:bg-red-500 p-3.5 rounded-xl transition flex items-center justify-center shadow-lg text-xl cursor-pointer";
        if (userCard) userCard.classList.remove('speaking-glow');
      } else {
        btn.className = "bg-emerald-600 hover:bg-emerald-500 p-3.5 rounded-xl transition flex items-center justify-center shadow-lg text-xl cursor-pointer";
      }
    }

    function toggleMasterMute() {
      isMasterMuted = !isMasterMuted;

      if (localAudioStream) {
        localAudioStream.getAudioTracks().forEach(track => track.enabled = !isMasterMuted && !isMicMuted);
      }

      document.querySelectorAll('#audio-containers audio').forEach(audio => {
        audio.muted = isMasterMuted;
      });

      const btnMaster = document.getElementById('btn-master-mute');
      const btnMic = document.getElementById('btn-mic');
      const userCard = document.getElementById(`user-card-${socket.id}`);

      if (isMasterMuted) {
        btnMaster.className = "bg-red-600 hover:bg-red-500 p-3.5 rounded-xl transition flex items-center justify-center shadow-lg text-xl border-2 border-red-300 cursor-pointer";
        btnMic.className = "bg-red-600 p-3.5 rounded-xl opacity-50 cursor-not-allowed";
        if (userCard) userCard.classList.remove('speaking-glow');
      } else {
        btnMaster.className = "bg-gray-700 hover:bg-gray-600 p-3.5 rounded-xl transition flex items-center justify-center shadow-lg text-xl cursor-pointer";
        btnMic.className = isMicMuted ? "bg-red-600 p-3.5 rounded-xl cursor-pointer" : "bg-emerald-600 p-3.5 rounded-xl cursor-pointer";
      }
    }

    function toggleExpandVideo(peerId) {
      const container = document.getElementById(`video-container-${peerId}`);
      if (container) {
        container.classList.toggle('expanded');
      }
    }

    function toggleFullScreenVideo(peerId) {
      const videoElem = document.getElementById(`video-${peerId}`);
      if (videoElem) {
        if (videoElem.requestFullscreen) {
          videoElem.requestFullscreen();
        } else if (videoElem.webkitRequestFullscreen) {
          videoElem.webkitRequestFullscreen();
        } else if (videoElem.msRequestFullscreen) {
          videoElem.msRequestFullscreen();
        }
      }
    }

    function toggleMuteUser(peerId) {
      mutedUsers[peerId] = !mutedUsers[peerId];
      const audioElem = document.getElementById(`audio-${peerId}`);
      if (audioElem) {
        audioElem.muted = isMasterMuted || mutedUsers[peerId];
      }
      if (mutedUsers[peerId]) {
        const userCard = document.getElementById(`user-card-${peerId}`);
        if (userCard) userCard.classList.remove('speaking-glow');
      }
      renderizarListaUsuarios();
    }

    async function toggleScreenShare() {
      if (localScreenStream) {
        localScreenStream.getTracks().forEach(track => track.stop());
        localScreenStream = null;
        const myVideo = document.getElementById('video-container-local');
        if (myVideo) myVideo.remove();
        document.getElementById('btn-screen').innerText = "📺 Compartilhar Tela";
        delete sharingUsers[socket.id];
        renderizarListaUsuarios();
        verificarTelasAtivas();

        Object.values(peers).forEach(async ({ pc }) => {
          const senders = pc.getSenders();
          const videoSender = senders.find(s => s.track && s.track.kind === 'video');
          if (videoSender) {
            pc.removeTrack(videoSender);
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
          }
        });
        return;
      }

      try {
        localScreenStream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            frameRate: { ideal: 60, max: 60 },
            width: { ideal: 1920, max: 1920 },
            height: { ideal: 1080, max: 1080 }
          },
          audio: false
        });
        
        sharingUsers[socket.id] = true;
        renderizarListaUsuarios();

        const container = document.createElement('div');
        container.id = `video-container-local`;
        container.className = "video-box relative bg-black rounded-xl overflow-hidden border border-cyan-500/40 flex flex-col shadow-lg";
        container.innerHTML = `
          <div class="absolute top-2 left-2 bg-black/80 backdrop-blur-md px-2 py-0.5 rounded text-[10px] text-cyan-400 font-cyber z-10 flex items-center gap-1.5">
            <span class="bg-red-600 text-white text-[8px] px-1 py-0.2 rounded live-badge font-bold">LIVE</span>
            Sua Tela
          </div>
          <div class="absolute top-2 right-2 flex gap-1 z-10">
            <button onclick="toggleExpandVideo('local')" class="bg-black/70 hover:bg-black text-white text-xs px-2 py-0.5 rounded border border-cyan-500/50 cursor-pointer">🔲</button>
            <button onclick="toggleFullScreenVideo('local')" class="bg-black/70 hover:bg-black text-white text-xs px-2 py-0.5 rounded border border-cyan-500/50 cursor-pointer">⛶</button>
          </div>
          <video id="video-local" autoplay muted playsinline class="w-full h-full object-contain cursor-pointer" onclick="toggleFullScreenVideo('local')"></video>
        `;
        document.getElementById('video-grid').appendChild(container);
        
        const videoLocalElem = document.getElementById('video-local');
        videoLocalElem.srcObject = localScreenStream;
        videoLocalElem.muted = true;

        const videoTrack = localScreenStream.getVideoTracks()[0];
        
        for (const [peerId, { pc }] of Object.entries(peers)) {
          const sender = pc.addTrack(videoTrack, localScreenStream);
          const parameters = sender.getParameters();
          if (!parameters.encodings) {
            parameters.encodings = [{}];
          }
          parameters.encodings[0].maxBitrate = 4000000;
          parameters.encodings[0].maxFramerate = 60;
          try {
            await sender.setParameters(parameters);
          } catch (e) {}

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          socket.emit('signal', { to: peerId, signal: offer, type: 'offer', nick });
        }

        document.getElementById('btn-screen').innerText = "🛑 Parar Partilha";

        videoTrack.onended = () => {
          toggleScreenShare();
        };

        verificarTelasAtivas();
      } catch (err) {}
    }

    function verificarTelasAtivas() {
      const videoGrid = document.getElementById('video-grid');
      const noSharesMsg = document.getElementById('no-shares-msg');
      const hasVideos = videoGrid.querySelectorAll('video').length > 0;
      if (noSharesMsg) {
        noSharesMsg.style.display = hasVideos ? 'none' : 'block';
      }
    }

    function enviarMsg() {
      const input = document.getElementById('chat-input');
      if (input.value.trim()) {
        socket.emit('send-chat', input.value.trim());
        input.value = '';
      }
    }

    function copiarLink() {
      navigator.clipboard.writeText(window.location.origin + '?room=' + roomId);
      document.getElementById('btn-copy-text').innerText = 'Copiado!';
      setTimeout(() => document.getElementById('btn-copy-text').innerText = 'Copiar ID/Link', 2000);
    }

    function sairDaSala() { location.reload(); }
  </script>
</body>
</html>
